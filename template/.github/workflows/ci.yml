name: ci
on:
  pull_request:
  push:
    branches: [main, loop/control]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harness self-test (hooks + status)
        run: node scripts/validate-status.mjs
      - name: App checks
        run: |
          if [ ! -f package.json ]; then echo "no app yet: framing only"; exit 0; fi
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present
